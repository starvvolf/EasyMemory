<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Recaller</title>
  <style>
    html, body { height: 100%; margin: 0; background: #F2F3F6; font: 14px/1.5 "Pretendard Variable", Pretendard, "Malgun Gothic", system-ui, sans-serif; color: #17191F; }
    @media (prefers-color-scheme: dark) { html, body { background: #0F1115; color: #E9EBEF; } }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #down { padding: 20px; display: none; }
    #down button { margin-top: 10px; padding: 6px 14px; border-radius: 8px; border: 1px solid #CDD1D9; background: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="down">
    <b>Recaller에 연결하지 못했어요.</b>
    <p>컴퓨터에서 <b>Recaller 시작.cmd</b>로 Recaller를 켠 다음 다시 시도해 주세요. (http://127.0.0.1:3000)</p>
    <button id="retry">다시 시도</button>
  </div>
  <iframe id="app" title="Recaller" hidden></iframe>
  <script src="panel.js"></script>
</body>
</html>
