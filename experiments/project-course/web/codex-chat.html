<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 튜터 · Recaller 실험</title>
<link rel="stylesheet" href="style.css">
<style>
  body { height: 100vh; overflow: hidden; }
  .cx { display: grid; grid-template-columns: 240px 1fr; height: 100vh; }
  .cx aside { border-right: 1px solid var(--line); padding: 12px; overflow: auto; background: var(--panel); }
  .cx aside h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .cx .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx .item:hover { background: var(--soft); } .cx .item.on { background: var(--acc-soft); }
  .cx main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  .cx header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .cx header b { flex: 1; }
  .cx select, .cx input.path { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 13px; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .bar code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar input.path { flex: 1; font-family: var(--mono); }
  .ask { margin: 8px 14px 0; padding: 8px 10px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .learned { padding: 4px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .learned summary { cursor: pointer; font-weight: 600; padding: 2px 0; }
  .learned .k { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--soft); margin-left: 4px; }
  .msgs { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 860px; line-height: 1.6; }
  .m.user { align-self: flex-end; background: var(--acc-soft); padding: 8px 12px; border-radius: 14px 4px 14px 14px; white-space: pre-wrap; }
  .m.assistant p { margin: 0 0 8px; white-space: pre-wrap; }
  .m.assistant pre { background: var(--soft); padding: 10px; border-radius: 8px; overflow: auto; margin: 0 0 8px; }
  .m.tool { font-size: 12px; color: var(--mut); white-space: pre-wrap; border-left: 2px solid var(--line); padding-left: 8px; }
  .m.error { color: var(--bad); white-space: pre-wrap; }
  .foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .foot textarea { flex: 1; resize: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font: inherit; }
  .mut { color: var(--mut); }
  @media (max-width: 700px) { .cx { grid-template-columns: 1fr; } .cx aside { display: none; } }
</style>
</head>
<body>
<div class="cx">
  <aside><h2>대화 <button id="new" class="btn small">+ 새 대화</button></h2><div id="list"></div><p class="small mut" id="status"></p></aside>
  <main>
    <header><b id="title">Codex 튜터</b><select id="model" title="모델(다음 질문부터)"></select></header>
    <div class="bar" id="wsbar"></div>
    <div id="editask"></div>
    <details class="learned" id="learned" hidden><summary></summary><ul></ul></details>
    <div class="msgs" id="msgs"></div>
    <div class="foot"><textarea id="q" rows="2" placeholder="물어보기 (Enter 보내기, Shift+Enter 줄바꿈)"></textarea><button id="send" class="btn primary">보내기</button></div>
  </main>
</div>
<script src="codex-chat.js"></script>
</body>
</html>
