<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실습 · Recaller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">R</span><span>실습</span><span class="tag">실험</span></div>
  <div class="top-right">
    <span id="aiChip" class="chip"></span>
    <!-- 11/4 사용자 "예전식은 다 숨겨": 코스 고르기 · 새 코스 정하기 · 실험방 링크는 숨김(주소로는 그대로 열림) -->
    <select id="runPick" aria-label="진행 중인 코스" hidden></select>
    <a class="btn ghost" href="#/lab" hidden>AI 실험방</a>
    <button id="newIntake" class="btn ghost" hidden>새 코스 정하기</button>
  </div>
</header>
<div id="nodeWarn" class="banner bad" hidden></div>
<main id="view"></main>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
