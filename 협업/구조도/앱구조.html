<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recaller 앱 구조</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 구조도.html과 같은 모양: 왼쪽 공부 영역 셋 → 공부 탭 화면 → 앱 서버 → 기억 → 다시 묻기, 아래 띠는 내 PC의 바탕. */
:root{
  --bg:#f7f8fa; --panel:#ffffff; --fg:#1b2230; --muted:#5d6678; --line:#8a93a6; --soft:#e7eaf0;
  --io:#2f63d6; --io-soft:#e6eefc; --kn:#c2334d; --kn-soft:#fbe8ec; --qa:#c8661a; --qa-soft:#fcefe2;
  --code:#3d7a57; --code-soft:#e3f2e9; --user:#8a4fc4; --user-soft:#f1e8fb;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#1a1f29; --fg:#e8ebf2; --muted:#9aa3b5; --line:#6f7890; --soft:#2a3140;
  --io:#7fa6ff; --io-soft:#1d2a45; --kn:#ff7d93; --kn-soft:#3a1f27; --qa:#f0a060; --qa-soft:#3a2a1c;
  --code:#7fcf9f; --code-soft:#1b3326; --user:#c9a2f0; --user-soft:#2e2240; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#1a1f29; --fg:#e8ebf2; --muted:#9aa3b5; --line:#6f7890; --soft:#2a3140;
  --io:#7fa6ff; --io-soft:#1d2a45; --kn:#ff7d93; --kn-soft:#3a1f27; --qa:#f0a060; --qa-soft:#3a2a1c;
  --code:#7fcf9f; --code-soft:#1b3326; --user:#c9a2f0; --user-soft:#2e2240; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header h1{margin:0;font-size:26px;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted)}
.canvas{background:var(--panel);border:1px solid var(--soft);border-radius:14px;overflow-x:auto}
.canvas svg{display:block;min-width:960px;width:100%;height:auto}
svg text{font-family:var(--sans);fill:var(--fg)}
.box{fill:var(--panel);stroke:var(--line);stroke-width:1.4}
.dash{stroke-dasharray:6 5}
.src{fill:var(--soft);stroke:var(--soft);stroke-width:1.4}
.src.main{stroke:var(--fg);stroke-width:2.6}
.ai{fill:var(--io-soft);stroke:var(--io);stroke-width:1.4}
.code{fill:var(--code-soft);stroke:var(--code);stroke-width:1.4}
.user{fill:var(--user-soft);stroke:var(--user);stroke-width:1.4}
.qa{fill:var(--qa-soft);stroke:var(--qa);stroke-width:1.4}
.kn{fill:var(--kn-soft);stroke:var(--kn);stroke-width:1.8}
.layer{fill:var(--panel);stroke:var(--kn);stroke-width:1;stroke-opacity:.5}
.arrow{stroke:var(--line);stroke-width:1.6;fill:none}
.arrow.loop{stroke:var(--kn);stroke-width:1.8}
.arrow.thin{stroke-dasharray:5 4;stroke-width:1.3}
.head{fill:var(--line)} .head.kn{fill:var(--kn)}
.t-lg{font-size:17px;font-weight:700} .t-md{font-size:14px;font-weight:500} .t-sm{font-size:12.5px;fill:var(--muted)}
.t-kn{font-size:12.5px;fill:var(--kn);font-weight:500}
.tag rect{rx:6} .tag text{font-family:var(--mono);font-size:12px;font-weight:500}
.tag.io rect{fill:var(--io-soft);stroke:var(--io)} .tag.io text{fill:var(--io)}
.tag.kn rect{fill:var(--kn-soft);stroke:var(--kn)} .tag.kn text{fill:var(--kn)}
.tag.qa rect{fill:var(--qa-soft);stroke:var(--qa)} .tag.qa text{fill:var(--qa)}
.hint{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.hint b{color:var(--fg);font-weight:500}
</style></head><body>
<div class="wrap">
  <header>
    <h1>Recaller 앱 구조</h1>
    <p>공부 탭에서 갈래마다 공부하면, 앱 서버가 남길 것을 골라 기억 하나로 모으고, 잊을 때쯤 오늘 탭이 다시 묻는다. (2026-11-12 기준)</p>
  </header>
  <div class="canvas">
    <svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" aria-label="Recaller 앱 구조">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head kn" d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <text x="40" y="44" class="t-sm">공부 영역 (공부 탭의 세 갈래)</text>
      <text x="290" y="44" class="t-sm">화면 · 해 보기</text>
      <text x="474" y="44" class="t-sm">앱 서버 · AI</text>
      <text x="690" y="44" class="t-sm">쌓기</text>
      <text x="972" y="44" class="t-sm">다시 묻기</text>

      <!-- 자료 -->
      <rect class="src main" x="30" y="70" width="220" height="110" rx="12"/>
      <text x="50" y="102" class="t-lg">자료 · 이론</text>
      <text x="50" y="128" class="t-md">PDF → 자료 지도</text>
      <text x="50" y="150" class="t-sm">줄기 · 구조 · 강의 · 문제 풀기</text>
      <path class="arrow" d="M250,125 L278,125" marker-end="url(#ah)"/>
      <rect class="user" x="282" y="90" width="160" height="70" rx="10"/>
      <text x="298" y="120" class="t-md">사용자</text>
      <text x="298" y="142" class="t-sm">읽기 · 강의 · 풀기</text>
      <path class="arrow" d="M442,125 L462,125" marker-end="url(#ah)"/>
      <rect class="ai" x="466" y="90" width="176" height="70" rx="10"/>
      <text x="482" y="120" class="t-md">자료 엔진 · AI</text>
      <text x="482" y="142" class="t-sm">줄기 계획 → 카드 채우기</text>
      <g class="tag io"><rect x="466" y="168" width="176" height="26"/><text x="476" y="186">문제·강의는 누를 때</text></g>
      <path class="arrow" d="M642,125 L686,150" marker-end="url(#ah)"/>

      <!-- 알고리즘 -->
      <rect class="src" x="30" y="260" width="220" height="90" rx="12"/>
      <text x="50" y="292" class="t-lg">알고리즘 · PS</text>
      <text x="50" y="318" class="t-md">PS 튜터 · 풀이 노트</text>
      <path class="arrow" d="M250,305 L278,305" marker-end="url(#ah)"/>
      <rect class="user" x="282" y="270" width="160" height="70" rx="10"/>
      <text x="298" y="300" class="t-md">사용자</text>
      <text x="298" y="322" class="t-sm">풀기 · 제출 · 다시 풀기</text>
      <path class="arrow" d="M442,305 L462,305" marker-end="url(#ah)"/>
      <rect class="code" x="466" y="270" width="84" height="70" rx="10"/>
      <text x="478" y="300" class="t-md">채점</text>
      <text x="478" y="322" class="t-sm">코드가</text>
      <rect class="ai" x="558" y="270" width="84" height="70" rx="10"/>
      <text x="570" y="300" class="t-md">튜터</text>
      <text x="570" y="322" class="t-sm">도움 네 칸</text>
      <path class="arrow" d="M642,305 L686,330" marker-end="url(#ah)"/>

      <!-- 실습 -->
      <rect class="src" x="30" y="420" width="220" height="90" rx="12"/>
      <text x="50" y="452" class="t-lg">실습 · 직접 만들기</text>
      <text x="50" y="478" class="t-md">VS Code + 튜터</text>
      <path class="arrow" d="M250,465 L278,465" marker-end="url(#ah)"/>
      <rect class="user" x="282" y="430" width="160" height="70" rx="10"/>
      <text x="298" y="460" class="t-md">사용자</text>
      <text x="298" y="482" class="t-sm">목표 → 만들기 → 검사</text>
      <path class="arrow" d="M442,465 L462,465" marker-end="url(#ah)"/>
      <rect class="ai" x="466" y="430" width="176" height="70" rx="10"/>
      <text x="482" y="460" class="t-md">실습 서버 · AI 튜터</text>
      <text x="482" y="482" class="t-sm">:4100 · OpenCode</text>
      <path class="arrow" d="M642,465 L686,430" marker-end="url(#ah)"/>

      <!-- 기억 -->
      <rect class="kn" x="690" y="70" width="240" height="440" rx="16"/>
      <text x="710" y="104" class="t-lg">기억</text>
      <text x="710" y="126" class="t-sm">갈래마다 남길 것을 골라 한곳에</text>
      <rect class="layer" x="706" y="142" width="208" height="130" rx="10"/>
      <text x="722" y="170" class="t-md">기억 탭 · 기억 도서관</text>
      <text x="722" y="194" class="t-sm">공부 탭과 같은 목록 · 같은 갈래</text>
      <text x="722" y="214" class="t-sm">카드 · 정리를 다시 보기</text>
      <text x="722" y="234" class="t-sm">아래 채팅으로 내 기억에 묻기</text>
      <rect class="layer" x="706" y="286" width="208" height="164" rx="10"/>
      <text x="722" y="314" class="t-md">기억 저장소</text>
      <text x="722" y="338" class="t-sm">뜻 = 카드 (질문 · 답)</text>
      <text x="722" y="358" class="t-sm">경험 = 맞힘 · 틀림 · 막힌 곳</text>
      <text x="722" y="378" class="t-sm">같은 기억은 하나로 합치기</text>
      <text x="722" y="398" class="t-sm">복습 날짜는 코드가 계산</text>
      <text x="722" y="430" class="t-sm">내 상태: 몰랐음 · 앎 · 졸업</text>
      <g class="tag kn"><rect x="706" y="466" width="208" height="26"/><text x="716" y="484">셋이 같이 쓰는 바닥</text></g>

      <!-- 다시 묻기 -->
      <g class="tag qa"><rect x="972" y="70" width="110" height="26"/><text x="982" y="88">복습 차례</text></g>
      <path class="arrow" d="M930,140 L968,140" marker-end="url(#ah)"/>
      <rect class="box" x="972" y="104" width="180" height="84" rx="12"/>
      <text x="990" y="134" class="t-lg">오늘 탭</text>
      <text x="990" y="160" class="t-sm">문제 풀기 · 이어서 하기</text>
      <path class="arrow" d="M1062,188 L1062,252" marker-end="url(#ah)"/>
      <rect class="box" x="972" y="256" width="180" height="84" rx="12"/>
      <text x="990" y="286" class="t-lg">사용자</text>
      <text x="990" y="312" class="t-sm">풀기 · 맞힘 · 틀림</text>
      <path class="arrow loop" d="M1062,340 C1062,420 1010,440 934,420" marker-end="url(#ahk)"/>
      <text x="960" y="462" class="t-kn">결과가 쌓이고 잊을 때쯤 다시</text>
      <rect class="box" x="972" y="474" width="180" height="36" rx="10"/>
      <text x="990" y="497" class="t-sm"><tspan style="fill:var(--fg);font-weight:500">기록 탭</tspan> · 이번 주 · 1년 잔디</text>

      <!-- 바탕 -->
      <text x="40" y="572" class="t-sm">바탕 (내 PC에서 돈다)</text>
      <rect class="ai" x="30" y="586" width="300" height="82" rx="12"/>
      <text x="48" y="616" class="t-md">AI · ChatGPT 로그인</text>
      <text x="48" y="640" class="t-sm">기본 gpt-6.1-terra · low</text>
      <text x="48" y="658" class="t-sm">만들고 돕기만 한다</text>
      <rect class="box" x="346" y="586" width="296" height="82" rx="12"/>
      <text x="364" y="616" class="t-md">앱 서버 127.0.0.1:3000</text>
      <text x="364" y="640" class="t-sm">화면 + 엔진 · 채점 · 기억 저장소</text>
      <text x="364" y="658" class="t-sm">(Next.js)</text>
      <rect class="box" x="658" y="586" width="272" height="82" rx="12"/>
      <text x="676" y="616" class="t-md">데이터 폴더 RecallerData</text>
      <text x="676" y="640" class="t-sm">자료 · 기억 · 기록 (비공개 git)</text>
      <text x="676" y="658" class="t-sm">켤 때 받고 끌 때 올림</text>
      <rect class="box dash" x="946" y="586" width="206" height="82" rx="12"/>
      <text x="964" y="616" class="t-md">Recaller 앱 창</text>
      <text x="964" y="640" class="t-sm">Electron · 켜고 끄는</text>
      <text x="964" y="658" class="t-sm">유일한 길</text>
      <text x="30" y="716" class="t-sm">켤 때: 코드 받기 → 데이터 받기 → 앱 서버 3000 → 실습 서버 4100 → 공부 화면 · 끌 때: 화면 저장 → 서버 끄기 → 데이터 올리기</text>
    </svg>
  </div>
  <p class="hint"><span><b>회색 화살표</b> = 흐름</span><span><b>빨간 선</b> = 복습 고리</span><span>AI는 만들고 돕기만 하고, 채점 · 기록 · 복습 날짜는 코드가 정한다.</span></p>
</div>
</body></html>
