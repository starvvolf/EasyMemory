<title>되짚기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=Noto+Serif+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#D8DEE5; --line-strong:#B9C2CC;
  --ink:#16202A; --muted:#5A6774; --faint:#8A96A2;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E6ECFB;
  --mark:#F7E26B; --mark-ink:#3A3000;
  --good:#1D7F52; --good-soft:#E3F3EA; --bad:#B93A26; --bad-soft:#FBE8E4; --help:#9A6400; --help-soft:#FBF0DA; --read:#1B7684; --read-soft:#DFF0F2;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 8px 24px rgba(22,32,42,.07);
  --radius:12px;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --read-font:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1318; --surface:#161D24; --surface-2:#1C242C; --line:#2A343E; --line-strong:#3A4652;
    --ink:#E5EAEF; --muted:#9AA7B3; --faint:#6F7C88;
    --accent:#7FA2FF; --accent-ink:#0B1222; --accent-soft:#1D2A48;
    --mark:rgba(247,226,107,.28); --mark-ink:#F5EBB0;
    --good:#5CC896; --good-soft:#15302A; --bad:#FF8A73; --bad-soft:#3A1E19; --help:#E8B458; --help-soft:#3A2D14; --read:#62C1CD; --read-soft:#14302F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1318; --surface:#161D24; --surface-2:#1C242C; --line:#2A343E; --line-strong:#3A4652;
  --ink:#E5EAEF; --muted:#9AA7B3; --faint:#6F7C88;
  --accent:#7FA2FF; --accent-ink:#0B1222; --accent-soft:#1D2A48;
  --mark:rgba(247,226,107,.28); --mark-ink:#F5EBB0;
  --good:#5CC896; --good-soft:#15302A; --bad:#FF8A73; --bad-soft:#3A1E19; --help:#E8B458; --help-soft:#3A2D14; --read:#62C1CD; --read-soft:#14302F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
body[data-view="read"] .wrap{max-width:1180px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.01em}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 18px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:13.5px}
.store{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.store i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.store[data-mode="db"] i{background:var(--good)}
.store[data-mode="local"] i{background:var(--help)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:22px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:7px 16px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* generic */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.small{min-height:32px;padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);white-space:nowrap}
.chip.page{font-family:var(--mono);font-weight:500}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.help{color:var(--help);background:var(--help-soft);border-color:transparent}
.chip.acc{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.note{border-radius:10px;padding:11px 14px;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.note.warn{background:var(--help-soft);border-color:transparent;color:var(--help)}
.note.err{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
mark.quote{background:var(--mark);color:var(--mark-ink);padding:1px 3px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* today */
.today{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.today h2{font-family:var(--display);font-size:22px;font-weight:700}
.counts{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap}
.counts div{display:flex;flex-direction:column}
.counts b{font-size:26px;font-weight:700;line-height:1.2}
.counts span{font-size:12.5px;color:var(--muted)}
.decks{display:flex;flex-direction:column;gap:10px}
.deck{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.deck h3{font-size:15.5px;font-weight:600}
.deck .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{grid-column:1/-1;display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)} .bar .r{background:var(--bad)} .bar .h{background:var(--help)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0;background:var(--c)}

/* practice card */
.session-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.progress{flex:1;min-width:140px;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;gap:18px}
.qhead{display:flex;gap:6px;flex-wrap:wrap}
.qprompt{font-size:19px;font-weight:600;line-height:1.55;letter-spacing:-.01em;white-space:pre-line}
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 14px;line-height:1.5;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-correct{border-color:var(--good);background:var(--good-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.answer-input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:11px 13px;background:var(--surface);font-size:16px}
textarea.answer-input{min-height:96px;resize:vertical;line-height:1.55}
.order-pool,.order-picked{display:flex;flex-wrap:wrap;gap:8px}
.order-picked{min-height:48px;border:1px dashed var(--line-strong);border-radius:10px;padding:8px;flex-direction:column}
.step{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 12px;text-align:left;line-height:1.45}
.step:hover:not(:disabled){border-color:var(--accent)}
.order-picked .step{background:var(--surface);display:flex;gap:10px}
.order-picked .step b{font-family:var(--mono);font-size:12px;color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.actions .spacer{flex:1}
.verdict{border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict.good{background:var(--good-soft)} .verdict.bad{background:var(--bad-soft)} .verdict.help{background:var(--help-soft)} .verdict.self{background:var(--surface-2)}
.verdict strong{font-size:15px}
.verdict.good strong{color:var(--good)} .verdict.bad strong{color:var(--bad)} .verdict.help strong{color:var(--help)}
.reveal{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.reveal dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.reveal dd{margin:2px 0 0}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.linkish{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--faint)}

/* builder */
.steps{display:flex;gap:0;margin-bottom:18px;counter-reset:s;flex-wrap:wrap}
.steps li{list-style:none;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--faint);padding-right:18px;margin-right:18px;border-right:1px solid var(--line);margin-bottom:6px}
.steps li:last-child{border-right:0}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:11.5px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-strong)}
.steps li[data-on="true"]{color:var(--ink);font-weight:600}
.steps li[data-on="true"]::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li[data-done="true"]::before{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.steps{padding:0;margin-top:0}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface-2)}
.drop[data-over="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=number],.field textarea{border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;background:var(--surface);width:100%}
.field textarea{min-height:120px;resize:vertical}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--bad)}
.objs{display:flex;flex-direction:column;gap:8px}
.obj{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--surface)}
.obj input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent)}
.obj .st{font-weight:600;line-height:1.5}
.obj .meta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.obj details{grid-column:2;font-size:13px;color:var(--muted)}
.obj summary{cursor:pointer;width:max-content}
.report{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.report div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.report b{display:block;font-size:22px;line-height:1.2}
.report span{font-size:12px;color:var(--muted)}
.itemlist{display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--surface);display:flex;flex-direction:column;gap:5px}
.item p{font-size:14px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap}
.item ul{margin:2px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--muted);max-height:180px;overflow:auto;background:var(--surface-2);border-radius:8px;padding:10px}

/* records */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:24px;line-height:1.25}
.tile span{font-size:12.5px;color:var(--muted)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.trail{display:flex;gap:3px;flex-wrap:wrap}
.trail i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.trail .g{background:var(--good)} .trail .r{background:var(--bad)} .trail .h{background:var(--help)} .trail .s{background:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.hidden{display:none!important}


/* floating question window */
.chatwin{position:fixed;z-index:15;display:flex;flex-direction:column;min-width:300px;min-height:220px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:hidden;
  background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid color-mix(in srgb,var(--line-strong) 70%,transparent);border-radius:14px;box-shadow:0 12px 40px rgba(10,15,20,.22);transition:background-color .15s}
.chatwin:focus-within,.chatwin:hover{background:color-mix(in srgb,var(--surface) 94%,transparent)}
.chatwin.dragging{user-select:none;opacity:.92}
.chatwin[data-mode="min"]{min-height:0;height:auto!important}
.chatwin[data-mode="min"] .chat-log,.chatwin[data-mode="min"] .chat-foot,.chatwin[data-mode="min"] .rz{display:none}
.chatwin[data-mode="max"] .rz{display:none}
.rz{position:absolute;z-index:3}
.rz-n,.rz-s{left:12px;right:12px;height:7px;cursor:ns-resize}
.rz-n{top:-3px} .rz-s{bottom:-3px}
.rz-e,.rz-w{top:12px;bottom:12px;width:7px;cursor:ew-resize}
.rz-e{right:-3px} .rz-w{left:-3px}
.rz-ne,.rz-nw,.rz-se,.rz-sw{width:16px;height:16px}
.rz-ne{top:-4px;right:-4px;cursor:nesw-resize} .rz-sw{bottom:-4px;left:-4px;cursor:nesw-resize}
.rz-nw{top:-4px;left:-4px;cursor:nwse-resize} .rz-se{bottom:-4px;right:-4px;cursor:nwse-resize}
.rz-se::after{content:"";position:absolute;right:7px;bottom:7px;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);border-radius:0 0 3px 0;opacity:.7}
.chat-head{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);cursor:grab;touch-action:none}
.chatwin.dragging .chat-head{cursor:grabbing}
.chat-head strong{font-size:13.5px}
.chat-head .grow{flex:1}
.chat-grip{width:14px;height:10px;background:radial-gradient(circle,var(--faint) 1.2px,transparent 1.3px) 0 0/5px 5px;opacity:.8}
.chat-log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.chat-hint{font-size:13px;color:var(--muted);line-height:1.6}
.chat-sugs{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink)}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.bubble{max-width:88%;display:flex;flex-direction:column;gap:3px}
.bubble.user{align-self:flex-end;align-items:flex-end}
.bubble .btext{padding:8px 12px;border-radius:12px;font-size:14.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.user .btext{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bubble.assistant .btext{background:color-mix(in srgb,var(--surface-2) 90%,transparent);border:1px solid var(--line);border-bottom-left-radius:4px;white-space:normal}
.bpage{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.outside{display:block;margin-top:4px;padding:6px 9px;border-radius:8px;background:var(--help-soft);color:var(--ink);font-size:13.5px}
.outside b{display:block;font-size:11px;color:var(--help);letter-spacing:.04em}
.chat-foot{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.chat-foot textarea{flex:1;resize:none;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:14px;line-height:1.5;max-height:120px}
@media (max-width:700px){
  .chatwin{left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto!important;height:58vh!important}
  .chatwin[data-mode="max"]{height:calc(100vh - 24px)!important}
  .rz{display:none}
  .chat-head{cursor:default}
  .chat-grip{display:none}
}
/* reader */
.chip.read{color:var(--read);background:var(--read-soft);border-color:transparent}
.bar .c{background:var(--read)}
.trail .c{background:var(--read)}
.verdict.read{background:var(--read-soft)} .verdict.read strong{color:var(--read)}
body[data-view="read"] .top{padding-block:12px 10px}
body[data-view="read"] .brand h1{font-size:21px}
body[data-view="read"] .brand p, body[data-view="read"] .store{display:none}
body[data-view="read"] .tabs{margin-bottom:0;padding:3px}
body[data-view="read"] .tabs button{padding:5px 12px;font-size:13.5px}
body[data-view="read"] .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qbtn{border:0;background:transparent;border-radius:8px;padding:6px 10px;min-height:34px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.qbtn:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.qbtn:disabled{opacity:.35;cursor:default}
.qbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rbar{display:flex;align-items:center;gap:6px;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.rbar select{border:0;background:transparent;font-weight:700;font-size:15px;color:var(--ink);max-width:min(360px,60vw);padding:4px 2px;cursor:pointer}
.rbar .grow{flex:1}
.pager{display:inline-flex;align-items:center;gap:2px}
.pager input{width:46px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:right;padding:4px 2px;font-weight:600}
.pager input:hover,.pager input:focus{border-color:var(--line-strong);background:var(--surface)}

<script>
"use strict";
/* ---------- tiny DOM helper (model text always goes through textContent) ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const $ = (s) => document.querySelector(s);
const now = () => Date.now();
const uid = (p) => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const MIN = 60e3, DAY = 864e5;
const INTERVALS = [10*MIN, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY];

/* ---------- answer normalization (one place, used for grading and validation) ---------- */
function norm(s){
  return String(s ?? "")
    .normalize("NFKC")
    .replace(/[−‐-―]/g, "-")
    .replace(/[’‘´`']/g, "′")
    .replace(/\^\{-1\}|\^-1|⁻¹/g, "^-1")
    .replace(/[·*]/g, "")
    .replace(/\s+/g, "")
    .replace(/[;、]/g, ",")
    .replace(/(^|,|\()\+/g, "$1")
    .replace(/(°|도)(?=$|,|\))/g, "")
    .replace(/(이다|입니다|다)\.?$/, "")
    .replace(/\.$/, "")
    .toLocaleLowerCase("ko-KR");
}
function looseText(s){ return String(s ?? "").normalize("NFKC").replace(/\s+/g, "").toLocaleLowerCase("ko-KR"); }

/* ---------- example deck (original notes, so the loop works before any generation) ---------- */
function exampleDeck(){
  const pages = [
    { n:1, text:"평행이동. 점 (x, y)에 이동량 (tx, ty)를 더하면 새 점은 (x+tx, y+ty)이다. 동차좌표로 쓰면 3×3 행렬의 마지막 열 위 두 칸에 tx와 ty가 놓이고 나머지는 단위행렬과 같다. 역변환은 이동량의 부호를 바꾼 T(-tx, -ty)이다." },
    { n:2, text:"회전. 원점을 기준으로 양의 각 θ만큼 돌리면 반시계 방향으로 회전한다. 좌표식은 x′ = x cosθ − y sinθ, y′ = x sinθ + y cosθ 이다. 90도 회전이면 (x, y)는 (−y, x)가 된다. 원점이 아닌 점 (a, b)를 중심으로 돌릴 때는 먼저 중심점이 원점에 오도록 평행이동하고, 원점 기준으로 회전한 뒤, 처음 이동을 되돌린다. 행렬로는 T(a, b)·R(θ)·T(−a, −b)이다." },
    { n:3, text:"스케일과 합성. 스케일 S(sx, sy)는 x에 sx, y에 sy를 곱한다. 역변환은 S(1/sx, 1/sy)이며 sx, sy가 0이 아니어야 한다. 여러 변환을 합칠 때 행렬 곱은 결합법칙이 성립하지만 교환법칙은 일반적으로 성립하지 않는다. 점을 열벡터로 쓰면 M = A·B·C에서 가장 오른쪽 C가 먼저 적용된다." }
  ];
  const O = (id, statement, kind, pg, quote) => ({ id, statement, kind, importance:"core", pages:[pg], quote });
  const objectives = [
    O("o1","점과 이동량으로 평행이동한 좌표를 계산할 수 있다","formula",1,"점 (x, y)에 이동량 (tx, ty)를 더하면 새 점은 (x+tx, y+ty)이다"),
    O("o2","동차좌표 이동 행렬에서 이동량의 위치를 말할 수 있다","fact",1,"3×3 행렬의 마지막 열 위 두 칸에 tx와 ty가 놓이고"),
    O("o3","원점 기준 90도 회전 결과를 계산할 수 있다","formula",2,"90도 회전이면 (x, y)는 (−y, x)가 된다"),
    O("o4","회전 좌표식을 기억해서 쓸 수 있다","formula",2,"x′ = x cosθ − y sinθ, y′ = x sinθ + y cosθ"),
    O("o5","임의의 점을 중심으로 한 회전 절차를 순서대로 말할 수 있다","procedure",2,"먼저 중심점이 원점에 오도록 평행이동하고, 원점 기준으로 회전한 뒤, 처음 이동을 되돌린다"),
    O("o6","스케일의 역변환 인수를 구할 수 있다","formula",3,"역변환은 S(1/sx, 1/sy)이며 sx, sy가 0이 아니어야 한다"),
    O("o7","행렬 곱의 결합법칙과 교환법칙 성립 여부를 구별할 수 있다","concept",3,"행렬 곱은 결합법칙이 성립하지만 교환법칙은 일반적으로 성립하지 않는다"),
    O("o8","열벡터 방식에서 합성 변환의 적용 순서를 판단할 수 있다","concept",3,"가장 오른쪽 C가 먼저 적용된다")
  ];
  const I = (objectiveId, format, prompt, extra, explanation) => {
    const o = objectives.find(x => x.id === objectiveId);
    return { id:"ex-"+objectiveId, objectiveId, format, prompt, ...extra, explanation, page:o.pages[0], quote:o.quote, quoteVerified:true, checks:[] };
  };
  const items = [
    I("o1","value","점 (3, −2)를 이동량 (−1, 5)만큼 평행이동하면 새 좌표는?",{ accepted:["(2,3)"] },"x는 3+(−1)=2, y는 −2+5=3이다."),
    I("o2","choice","동차좌표 3×3 평행이동 행렬에서 tx, ty가 놓이는 자리는?",{ options:["마지막 열의 위 두 칸","마지막 행의 앞 두 칸","주대각선의 위 두 칸","첫째 열의 아래 두 칸"], answer:0 },"점을 열벡터로 곱하면 마지막 열의 값이 x, y에 더해진다."),
    I("o3","value","점 (0, 4)를 원점 기준 양의 방향으로 90도 회전하면 새 좌표는?",{ accepted:["(-4,0)"] },"(x, y)가 (−y, x)가 되므로 (0, 4)는 (−4, 0)이 된다."),
    I("o4","card","원점 기준으로 θ만큼 회전할 때 x′와 y′의 좌표식을 쓰세요.",{ answer:"x′ = x cosθ − y sinθ\ny′ = x sinθ + y cosθ" },"x′에는 −y sinθ, y′에는 +x sinθ가 붙는 부호에 주의한다."),
    I("o5","order","점 (a, b)를 중심으로 θ만큼 회전하는 절차를 순서대로 고르세요.",{ steps:["중심점이 원점에 오도록 평행이동","원점 기준으로 θ만큼 회전","처음 평행이동을 되돌리기"] },"회전은 원점 기준으로만 정의되므로 중심을 원점으로 옮겼다가 되돌린다."),
    I("o6","value","스케일 S(2, 4)를 되돌리는 역변환의 스케일 인수 (sx, sy)는?",{ accepted:["(1/2,1/4)","(0.5,0.25)","s(1/2,1/4)"] },"각 축의 배율을 역수로 바꾼다."),
    I("o7","choice","변환 행렬의 곱셈에 대해 옳은 설명은?",{ options:["결합법칙은 성립하고 교환법칙은 일반적으로 불성립","교환법칙은 성립하고 결합법칙은 일반적으로 불성립","결합법칙과 교환법칙이 모두 일반적으로 성립","결합법칙과 교환법칙이 모두 일반적으로 불성립"], answer:0 },"괄호 위치는 바꿔도 되지만 곱하는 순서는 바꾸면 결과가 달라질 수 있다."),
    I("o8","choice","점을 열벡터로 쓸 때 M = A·B·C를 적용하면 실제로 변환이 적용되는 순서는?",{ options:["C → B → A","A → B → C","B → A → C","A → C → B"], answer:0 },"열벡터 p에 대해 M p = A(B(C p))이므로 C가 가장 먼저다.")
  ];
  return { id:"example", title:"2D 기하 변환 (예시)", sourceName:"예시 요약 노트 · 3쪽", example:true, createdAt:now(), pages, objectives, items, events:[], sched:{} };
}

/* ---------- store: per-viewer private db, else browser, else memory ---------- */
const Store = {
  mode:"memory", db:null, uid:null, queue:{},
  async init(){
    const use = window.claude && typeof window.claude.use === "function" ? window.claude.use.bind(window.claude) : null;
    if (use){
      try{
        const [db, user, assets] = await Promise.all([use("db"), use("user"), use("assets").catch(() => null)]);
        this.assets = assets || null;
        const id = user ? await user.id() : null;
        if (db && id){ this.db = db; this.uid = id; this.mode = "db"; return; }
      }catch(e){ /* fall through */ }
    }
    try{ localStorage.setItem("dejipgi.probe","1"); localStorage.removeItem("dejipgi.probe"); this.mode = "local"; }catch(e){ this.mode = "memory"; }
  },
  col(){ return this.db.collection("data/users/" + this.uid); },
  async loadAll(){
    if (this.mode === "db"){
      try{
        const snap = await this.col().get();
        const out = {};
        snap.docs.forEach(d => { const v = d.data(); if (v && v.id) out[v.id] = JSON.parse(JSON.stringify(v)); });
        return out;
      }catch(e){ this.mode = "memory"; return {}; }
    }
    if (this.mode === "local"){
      try{ return JSON.parse(localStorage.getItem("dejipgi.v1") || "{}"); }catch(e){ return {}; }
    }
    return {};
  },
  save(deck){
    const id = deck.id;
    const body = JSON.parse(JSON.stringify(deck));
    if (body.events.length > 800) body.events = body.events.slice(-800);
    if (body.explanations){ const keys = Object.keys(body.explanations).sort((a,b) => body.explanations[b].t - body.explanations[a].t); keys.slice(24).forEach(k => delete body.explanations[k]); }
    const run = async () => {
      if (this.mode === "db"){
        try{ await this.col().doc(id).set(body); }
        catch(e){ if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 쓰지 않는 자료를 지워 주세요."); else if (e && e.code === "invalid_argument") { this.mode = "memory"; updateStoreChip(); toast("이 화면에서는 기록을 저장할 수 없어요. 새로고침하면 사라집니다."); } }
      } else if (this.mode === "local"){
        try{ const all = JSON.parse(localStorage.getItem("dejipgi.v1") || "{}"); all[id] = body; localStorage.setItem("dejipgi.v1", JSON.stringify(all)); }catch(e){}
      }
    };
    this.queue[id] = (this.queue[id] || Promise.resolve()).then(run, run);
    return this.queue[id];
  },
  async remove(id){
    if (this.mode === "db"){ try{ await this.col().doc(id).delete(); }catch(e){} }
    else if (this.mode === "local"){ try{ const all = JSON.parse(localStorage.getItem("dejipgi.v1") || "{}"); delete all[id]; localStorage.setItem("dejipgi.v1", JSON.stringify(all)); }catch(e){} }
  }
};

/* ---------- scheduling & status ---------- */
function schedOf(deck, itemId){ return deck.sched[itemId] || (deck.sched[itemId] = { box:0, due:0, seen:false }); }
function isDue(deck, item, t = now()){ const s = deck.sched[item.id]; return !!(s && s.seen && s.due <= t); }
function isNew(deck, item){ const s = deck.sched[item.id]; return !s || !s.seen; }
function applyOutcome(deck, item, outcome){
  // outcome: "correct" | "wrong" | "unsure" | "assisted"
  const s = schedOf(deck, item.id); const t = now(); s.seen = true;
  if (outcome === "correct"){ s.box = Math.min(s.box + 1, INTERVALS.length - 1); s.due = t + INTERVALS[s.box]; s.lastIndep = t; }
  else if (outcome === "unsure"){ s.due = t + DAY; }
  else if (outcome === "wrong"){ s.box = 0; s.due = t + 10*MIN; }
  else if (outcome === "assisted"){ s.due = t + 10*MIN; }
}
function itemStatus(deck, item){
  const evs = deck.events.filter(e => e.item === item.id);
  if (!evs.length) return "new";
  const indep = evs.filter(e => (e.kind === "submit" || e.kind === "rate") && !e.assisted && !e.afterReading);
  const s = deck.sched[item.id] || {};
  if (!indep.length) return evs.some(e => e.afterReading) ? "readcheck" : "assisted";
  const last = indep[indep.length - 1];
  const lastOk = last.kind === "submit" ? last.correct === true : last.rating === "remembered";
  if (!lastOk || (s.due && s.due <= now())) return "review";
  const days = new Set(indep.filter(e => e.kind === "submit" ? e.correct : e.rating === "remembered").map(e => new Date(e.t).toDateString()));
  return days.size >= 3 ? "steady" : "recent";
}

    if (isNew(deck, it)) c.fresh++; else if (isDue(deck, it, t)) c.due++;
    const st = itemStatus(deck, it);
    if (st === "recent" || st === "steady") c.good++; else if (st === "review") c.review++; else if (st === "assisted") c.help++; else if (st === "readcheck") c.read++;
  }
  return c;

/* ----- session ----- */
function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function startSession(deckId, allowEarly){
  const decks = deckId ? [S.decks[deckId]] : Object.values(S.decks);
  const t = now(); let queue = [];
  for (const d of decks){
    const due = d.items.filter(it => isDue(d, it, t)).sort((a,b) => d.sched[a.id].due - d.sched[b.id].due).map(it => ({ deck:d.id, item:it.id }));
    const fresh = d.items.filter(it => isNew(d, it)).slice(0, 10).map(it => ({ deck:d.id, item:it.id }));
    queue.push(...due, ...fresh);
  }
  if (!queue.length && allowEarly && deckId){
    const d = S.decks[deckId];
    queue = d.items.slice().sort((a,b) => (d.sched[a.id]?.due || 0) - (d.sched[b.id]?.due || 0)).slice(0, 10).map(it => ({ deck:d.id, item:it.id }));
  }
  if (!queue.length){ toast("지금 풀 문제가 없어요."); return; }
  queue = queue.slice(0, 25);
  S.session = { queue, i:0, phase:"ask", assisted:new Set(), requeued:new Set(), results:[], cur:null, mode:"review", viewed:new Set() };
  prepCurrent(); setView("practice");
}
function itemsOnPage(d, page){
  return d.items.filter(it => it.page === page || (d.objectives.find(o => o.id === it.objectiveId)?.pages || []).includes(page));
}
function startCheck(deckId, page){
  const d = S.decks[deckId];
  const items = itemsOnPage(d, page);
  if (!items.length){ toast("이 쪽에 연결된 문제가 없어요."); return; }
  S.session = { queue: items.map(it => ({ deck:d.id, item:it.id })), i:0, phase:"ask", assisted:new Set(), requeued:new Set(), results:[], cur:null, mode:"check", page, viewed:new Set() };
  prepCurrent(); setView("practice");
}
function assistedNow(deck, item){ return S.session.assisted.has(item.id) || S.session.viewed.has(deck.id + ":" + item.page); }
function applyCheck(deck, item){
  // right after reading: never counts as memory evidence; real review starts tomorrow
  const s = schedOf(deck, item.id); s.seen = true; s.due = Math.max(s.due || 0, now() + DAY);
}
function curRef(){ const q = S.session.queue[S.session.i]; if (!q) return null; const deck = S.decks[q.deck]; return { deck, item: deck.items.find(x => x.id === q.item) }; }
function prepCurrent(){
  const r = curRef(); if (!r) return;
  const it = r.item;
  S.session.cur = { pick:null, text:"", order:[], pool: it.format === "order" ? shuffle(it.steps.map((s,i) => i)) : [], optOrder: it.format === "choice" ? shuffle(it.options.map((o,i) => i)) : [], verdict:null, overridden:false, cardShown:false };
}
function logEvent(deck, item, ev){ deck.events.push({ t:now(), item:item.id, ...ev }); }
function finishItem(outcome){
  const { deck, item } = curRef();
  if (S.session.mode === "check") applyCheck(deck, item); else applyOutcome(deck, item, outcome);
  S.session.results.push({ deck:deck.id, item:item.id, outcome });
  S.session.assisted.add(item.id); // the result screen shows the answer, so a retry later in this session is not independent
  if ((outcome === "wrong" || outcome === "assisted") && !S.session.requeued.has(item.id)){
    S.session.requeued.add(item.id);
    const pos = Math.min(S.session.i + 4, S.session.queue.length);
    S.session.queue.splice(pos, 0, { deck:deck.id, item:item.id, retry:true });
  }
  Store.save(deck);
}
function submitAnswer(){
  const { deck, item } = curRef(); const c = S.session.cur;
  const assisted = assistedNow(deck, item); const reading = S.session.mode === "check" || undefined;
  let correct = null;
  if (item.format === "choice"){ if (c.pick == null) return; correct = c.pick === item.answer; }
  else if (item.format === "value"){ if (!c.text.trim()) return; correct = item.accepted.some(a => norm(a) === norm(c.text)); }
  else if (item.format === "order"){ if (c.order.length !== item.steps.length) return; correct = c.order.every((v,i) => v === i); }
  logEvent(deck, item, { kind:"submit", correct, assisted, afterReading:reading, answer: item.format === "value" ? c.text.slice(0, 80) : undefined });
  c.verdict = assisted ? "assisted" : reading ? (correct ? "read-good" : "read-bad") : correct ? "good" : "bad";
  finishItem(assisted ? "assisted" : correct ? "correct" : "wrong");
  S.session.phase = "result"; render();
}
function dontKnow(){
  const { deck, item } = curRef(); const c = S.session.cur;
  const assisted = assistedNow(deck, item); const reading = S.session.mode === "check" || undefined;
  logEvent(deck, item, { kind:"submit", correct:false, assisted, gaveUp:true, afterReading:reading });
  c.verdict = assisted ? "assisted" : reading ? "read-bad" : "bad";
  finishItem(assisted ? "assisted" : "wrong");
  S.session.phase = "result"; render();
}
function peek(){
  const { deck, item } = curRef(); const c = S.session.cur;
  S.session.assisted.add(item.id);
  logEvent(deck, item, { kind:"reveal", afterReading: S.session.mode === "check" || undefined });
  c.verdict = "assisted";
  finishItem("assisted");
  S.session.phase = "result"; render();
}
function showCard(){ S.session.cur.cardShown = true; S.session.phase = "rate"; render(); }
function rateCard(rating){
  const { deck, item } = curRef(); const c = S.session.cur;
  const assisted = assistedNow(deck, item); const reading = S.session.mode === "check" || undefined;
  logEvent(deck, item, { kind:"rate", rating, assisted, afterReading:reading });
  c.verdict = assisted ? "assisted" : reading ? (rating === "remembered" ? "read-good" : rating === "unsure" ? "read-mid" : "read-bad") : rating === "remembered" ? "self-good" : rating === "unsure" ? "self-mid" : "bad";
  finishItem(assisted ? "assisted" : rating === "remembered" ? "correct" : rating === "unsure" ? "unsure" : "wrong");
  S.session.phase = "result"; render();
}
function overrideCorrect(){
  const { deck, item } = curRef(); const c = S.session.cur;
  const ev = [...deck.events].reverse().find(e => e.item === item.id && e.kind === "submit");
  if (ev){ ev.correct = true; ev.override = true; }
  if (S.session.mode === "check"){ c.verdict = "read-good"; c.overridden = true; S.session.queue = S.session.queue.filter((q, idx) => !(idx > S.session.i && q.retry && q.item === item.id)); Store.save(deck); render(); return; }
  const s = schedOf(deck, item.id); s.box = Math.min(s.box + 1, INTERVALS.length - 1); s.due = now() + INTERVALS[s.box]; s.lastIndep = now();
  const res = S.session.results[S.session.results.length - 1]; if (res) res.outcome = "correct";
  S.session.queue = S.session.queue.filter((q, idx) => !(idx > S.session.i && q.retry && q.item === item.id));
  c.verdict = "good"; c.overridden = true;
  Store.save(deck); render();
}
function nextItem(){
  S.session.i++; S.session.phase = "ask";
  if (S.session.i >= S.session.queue.length){ S.session.phase = "done"; }
  else prepCurrent();
  render();
  const f = document.querySelector("[data-autofocus]"); if (f) f.focus();
}
const FORMAT_LABEL = { choice:"고르기", value:"값 쓰기", order:"순서 맞추기", card:"떠올리고 확인" };

  const locked = s.phase !== "ask";

function fmtWhen(t){
  const d = t - now();
  if (d < 60*MIN) return `${Math.max(1, Math.round(d / MIN))}분 뒤`;
  if (d < DAY) return `${Math.round(d / (60*MIN))}시간 뒤`;

}

const DESIGN_BUDGET = 46000;
function pagesInRange(){ const b = S.builder; return b.pages.filter(p => p.n >= b.from && p.n <= b.to && p.text.trim()); }
function pagesBlock(pages, capPer = 3500){ return pages.map(p => `[p.${p.n}]\n${p.text.slice(0, capPer)}`).join("\n\n"); }
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.append(s); }); }
async function readPdf(file){
  const b = S.builder;
  b.busy = true; b.error = ""; b.status = "PDF를 읽는 중…"; render();
  try{
    await loadPdfLib();
    const data = new Uint8Array(await file.arrayBuffer());
    const doc = await window.pdfjsLib.getDocument({ data, isEvalSupported:false }).promise;
    const pages = [];
    for (let n = 1; n <= doc.numPages; n++){
      const page = await doc.getPage(n);
      const tc = await page.getTextContent();
      let text = "";
      for (const it of tc.items){ if (typeof it.str !== "string") continue; text += it.str; text += it.hasEOL ? "\n" : " "; }
      pages.push({ n, text: text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim() });
      if (n % 5 === 0){ b.status = `PDF를 읽는 중… ${n}/${doc.numPages}쪽`; render(); }
    }
    setSource(pages, file.name);
    b.file = file; b.pdfDoc = doc;
  }catch(e){
    b.error = "PDF를 읽지 못했어요. 암호가 걸렸거나 손상된 파일일 수 있어요. 텍스트를 붙여 넣어도 됩니다.";
  }finally{ b.busy = false; b.status = ""; render(); }
}
function setSource(pages, name){
  const b = S.builder;
  b.pages = pages; b.sourceName = name; b.from = 1; b.to = pages.length;
  // shrink range to the budget if needed
  while (b.to > b.from && bytes(pagesBlock(pagesInRange())) > DESIGN_BUDGET) b.to--;
  b.objectives = []; b.selected = new Set(); b.items = []; b.report = null; b.step = 1; b.log = [];
}
function useSampleText(){
  const b = S.builder; b.file = null; b.pdfDoc = null;
  const raw = b.paste.trim(); if (!raw) return;
  const parts = raw.split(/\f|\n-{3,}\n/).flatMap(chunk => { const out = []; let cur = ""; for (const para of chunk.split(/\n{2,}/)){ if ((cur + para).length > 1600 && cur){ out.push(cur); cur = ""; } cur += (cur ? "\n\n" : "") + para; } if (cur) out.push(cur); return out; });
  setSource(parts.map((t, i) => ({ n:i + 1, text:t.trim() })), "붙여 넣은 글");
  render();
}

  const errors = [], warnings = [];

  const P = looseText(it.prompt);
  const leaks = (a) => { const n = looseText(a); return n.length >= 2 && P.includes(n); };
  if (it.format === "choice"){
    const uniq = new Set(it.options.map(looseText));
    if (it.options.length !== 4 || uniq.size !== 4) errors.push("보기는 서로 다른 4개여야 한다");
    else if (!(it.answer >= 0 && it.answer <= 3 && Number.isInteger(it.answer))) errors.push("answer 번호가 잘못됐다");
    else {
      const right = it.options[it.answer].length;
      const others = it.options.filter((_, i) => i !== it.answer).map(s => s.length);
      const avg = others.reduce((a,b) => a+b, 0) / others.length;
      if (right > avg * 1.3 && right - avg > 6) errors.push(`정답 보기(${right}자)가 오답 평균(${avg.toFixed(0)}자)보다 눈에 띄게 길다`);
      if (it.options.some((o, i) => i !== it.answer && ABSOLUTE.test(o))) warnings.push("오답에 티 나는 절대 표현이 있다");
      if (leaks(it.options[it.answer]) && it.options[it.answer].length >= 4) errors.push("정답 보기 문장이 문제 문장에 들어 있다");
    }
  }
  if (it.format === "value"){
    if (!it.accepted.length) errors.push("인정 답안이 없다");
    const composite = it.accepted.some(a => a.length > 24 || (a.match(/[,;→]/g) || []).length >= 2 && !/^\(.*\)$/.test(a));
    if (composite){ it.format = "card"; it.answer = it.accepted[0]; delete it.accepted; it.checks.push("여러 요소를 한 칸에 쓰는 답이라 ‘떠올리고 확인’ 형식으로 바꿈"); }
    else if (it.accepted.some(leaks)) errors.push("정답 값이 문제 문장에 들어 있다");
  }
  if (it.format === "order"){
    if (it.steps.length < 3 || it.steps.length > 8) errors.push("순서 단계는 3~8개여야 한다");
    if (new Set(it.steps.map(looseText)).size !== it.steps.length) errors.push("같은 단계가 중복됐다");
  }
  if (it.format === "card"){
    if (!it.answer) errors.push("모범 답이 없다");
    else {
      const toks = (it.answer.match(/[\p{L}\p{N}]{2,}/gu) || []).map(t => t.toLocaleLowerCase("ko-KR"));
      if (toks.length >= 3){ const hit = toks.filter(t => P.includes(t)).length / toks.length; if (hit >= 0.75) errors.push("모범 답의 핵심 낱말 대부분이 문제 문장에 이미 있다"); }
    }
  }
  if (!it.explanation) warnings.push("설명이 없다");
  if (!validPages.has(it.page)) { const guess = [...validPages][0]; it.page = guess || it.page; warnings.push("근거 쪽 번호를 목표의 쪽으로 바로잡음"); }
  const src = pagesByN.get(it.page);
  it.quoteVerified = !!(it.quote && src && looseText(src).includes(looseText(it.quote).slice(0, 40)));
  if (!it.quoteVerified) warnings.push("인용이 원문과 글자 그대로 일치하지 않는다");
  return { errors, warnings };
}
async function runDesign(){
  const b = S.builder; if (b.busy || !sampleFn) return;
  b.busy = true; b.error = ""; b.status = "학습목표를 설계하는 중… (보통 20~60초)"; b.ctl = new AbortController(); render();
  try{
    const out = await sampleFn.json(designPrompt(), { signal:b.ctl.signal, modelTier:"default" });
    const list = Array.isArray(out?.objectives) ? out.objectives : [];
    const valid = new Set(pagesInRange().map(p => p.n));
    const seen = new Set();
    b.objectives = list.map((o, i) => ({
      id:"o" + (i + 1), statement:String(o.statement || "").trim(), kind:String(o.kind || "fact"), importance:o.importance === "support" ? "support" : "core",
      pages:(Array.isArray(o.pages) ? o.pages.map(Number) : []).filter(n => valid.has(n)), quote:String(o.quote || "").trim()
    })).filter(o => o.statement && o.pages.length && !seen.has(looseText(o.statement)) && seen.add(looseText(o.statement)));
    b.title = String(out?.title || b.sourceName).slice(0, 40);
    if (!b.objectives.length){ b.error = "학습목표를 찾지 못했어요. 쪽 범위를 바꾸거나 목적을 적어 다시 시도해 주세요."; }
    else { b.selected = new Set(b.objectives.filter(o => o.importance === "core").map(o => o.id)); if (!b.selected.size) b.objectives.forEach(o => b.selected.add(o.id)); b.step = 2; }
  }catch(e){ b.error = sampleErrorCopy(e); }

}
async function runAuthoring(){
  const b = S.builder; if (b.busy || !sampleFn) return;
  const objs = b.objectives.filter(o => b.selected.has(o.id)); if (!objs.length) return;
  b.busy = true; b.error = ""; b.items = []; b.log = []; b.step = 3; b.ctl = new AbortController();
  const rep = { made:0, repaired:0, converted:0, dropped:0, warned:0, dup:0 };
  const pagesByN = new Map(b.pages.map(p => [p.n, p.text]));
  const batches = []; for (let i = 0; i < objs.length; i += 5) batches.push(objs.slice(i, i + 5));
  try{
    for (let k = 0; k < batches.length; k++){
      const bo = batches[k];
      b.status = `문제를 만드는 중… ${k + 1}/${batches.length}묶음`; render();
      const need = [...new Set(bo.flatMap(o => o.pages))].sort((a,c) => a-c);
      let pages = need.map(n => ({ n, text:pagesByN.get(n) || "" }));
      while (pages.length > 1 && bytes(pagesBlock(pages, 3000)) > 30000) pages = pages.slice(0, -1);
      const raw = await sampleFn.json(authorPrompt(bo, pages), { signal:b.ctl.signal, modelTier:"default", cache:false });
      const ids = new Set(bo.map(o => o.id));
      let items = (Array.isArray(raw) ? raw : []).map(r => coerceItem(r, ids)).filter(Boolean);
      const bad = [];
      for (const it of items){
        const vp = new Set(bo.find(o => o.id === it.objectiveId).pages);
        const before = it.format;
        const v = validateItem(it, pagesByN, vp);
        if (before !== it.format) rep.converted++;
        it.warnings = v.warnings;
        if (v.errors.length) bad.push({ item:it, issues:v.errors });
      }
      b.log.push(`묶음 ${k + 1}: ${items.length}문제 생성, 검사 통과 ${items.length - bad.length}`);
      if (bad.length){
        b.status = `검사에 걸린 ${bad.length}문제를 고치는 중…`; render();
        let fixed = [];
        try{ fixed = await sampleFn.json(repairPrompt(bad, pages), { signal:b.ctl.signal, modelTier:"default", cache:false }); }catch(e){ if (e && e.code === "cancelled") throw e; fixed = []; }
        const repl = new Map();
        (Array.isArray(fixed) ? fixed : []).forEach((r, idx) => {
          const orig = bad[idx]; if (!orig) return;
          const it = coerceItem(r, ids); if (!it || it.objectiveId !== orig.item.objectiveId) return;
          const vp = new Set(bo.find(o => o.id === it.objectiveId).pages);
          const v = validateItem(it, pagesByN, vp);
          it.warnings = v.warnings;
          if (!v.errors.length){ it.checks.push("검사 후 자동 수정됨"); repl.set(orig.item, it); rep.repaired++; }
        });
        items = items.map(it => repl.get(it) || it).filter(it => {
          if (bad.some(x => x.item === it)){ rep.dropped++; b.log.push(`제외: ${it.prompt.slice(0, 40)}… (${bad.find(x => x.item === it).issues.join(", ")})`); return false; }
          return true;
        });
      }
      for (const it of items){
        const key = looseText(it.prompt);
        if (b.items.some(x => looseText(x.prompt) === key)){ rep.dup++; continue; }
        if (it.warnings.length) rep.warned++;
        b.items.push(it); rep.made++;
      }
      render();
    }
    b.report = rep;
  }catch(e){ b.error = sampleErrorCopy(e); b.report = rep; }
  finally{ b.busy = false; b.status = ""; b.ctl = null; render(); }
}
function trimPages(pages, budget = 110000){
  const out = pages.map(p => ({ n:p.n, text:p.text }));
  let cap = 4000;
  while (cap > 300 && bytes(JSON.stringify(out.map(p => ({ n:p.n, text:p.text.slice(0, cap) })))) > budget) cap = Math.floor(cap * 0.8);
  return out.map(p => ({ n:p.n, text:p.text.slice(0, cap) }));
}
async function uploadPdf(file){
  if (!Store.assets || !file) return null;
  try{ const r = await Store.assets.upload(file); return r && r.id ? { id:r.id, url:r.url, name:file.name, size:file.size } : null; }
  catch(e){ return null; }
}
async function saveBuilt(){

    min.textContent = m === "min" ? "▢" : "—"; min.title = m === "min" ? "펼치기" : "접기"; min.setAttribute("aria-label", min.title);

    else if (m === "max" && innerWidth > 700){
      const w = Math.min(innerWidth - 32, Math.max(560, Math.round(innerWidth * 0.46)));
      Object.assign(this.el.style, { left:(innerWidth - w - 16) + "px", top:"16px", width:w + "px", height:(innerHeight - 32) + "px" });
    }
    else if (m === "min" && innerWidth > 700){
      const r = this.el.getBoundingClientRect();
      Object.assign(this.el.style, { height:"", top:Math.min(r.top, innerHeight - 60) + "px" });
    }
    if (m !== "min") setTimeout(() => { const log = this.el.querySelector("#chatLog"); if (log) log.scrollTop = log.scrollHeight; }, 0);
  },
  toggle(){ this.isOpen() ? this.close() : this.open(); },
  close(){ if (this.ctl) this.ctl.abort(); if (this.el) this.el.hidden = true; if (S.view === "read") render(); },
  open(){
    if (!this.el) this.build();
    this.el.hidden = false; this.setMode(this.mode === "max" ? "max" : "normal"); this.paint();
    ensureKatex().then(ok => { if (ok && this.isOpen()) this.paint(); });
    setTimeout(() => this.el.querySelector("textarea").focus(), 0);
    if (S.view === "read") render();
  },
  place(){
    const b = this.box(), vw = innerWidth, vh = innerHeight;
    if (vw <= 700){ Object.assign(this.el.style, { left:"", top:"", width:"", height:"" }); return; }
    const w = Math.min(Math.max(b?.w || 380, 300), vw - 24), hgt = Math.min(Math.max(b?.h || Math.min(480, vh - 220), 260), vh - 24);
    const x = Math.min(Math.max(b?.x ?? vw - w - 24, 8), vw - w - 8), y = Math.min(Math.max(b?.y ?? 120, 8), vh - hgt - 8);
    Object.assign(this.el.style, { left:x + "px", top:y + "px", width:w + "px", height:hgt + "px" });
  },
  build(){
    const ta = h("textarea", { id:"chatInput", rows:"2", placeholder:"지금 보는 쪽에 대해 물어보세요 (Enter 보내기, Shift+Enter 줄바꿈)" });
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); this.send(); } });
    const head = h("div", { class:"chat-head" },
      h("span", { class:"chat-grip", "aria-hidden":"true" }),
      h("strong", { id:"chatTitle", text:"질문하기" }),
      h("span", { class:"grow" }),
      h("button", { class:"qbtn", title:"대화 비우기", onclick: () => { if (this.ctl) this.ctl.abort(); this.msgs = []; this.err = ""; this.paint(); } }, "비우기"),
      h("button", { class:"qbtn", id:"chatMin", "aria-label":"질문 창 접기", title:"접기", onclick: () => this.setMode(this.mode === "min" ? "normal" : "min") }, "—"),
      h("button", { class:"qbtn", id:"chatMax", "aria-label":"질문 창 크게", title:"크게 보기", onclick: () => this.setMode(this.mode === "max" ? "normal" : "max") }, "⤢"),
      h("button", { class:"qbtn", "aria-label":"질문 창 닫기", title:"닫기", onclick: () => this.close() }, "✕"));
    head.addEventListener("dblclick", (e) => { if (!e.target.closest("button")) this.setMode(this.mode === "max" ? "normal" : "max"); });
    this.el = h("section", { class:"chatwin", role:"dialog", "aria-label":"질문하기", hidden:true },
      head,
      h("div", { class:"chat-log", id:"chatLog", "aria-live":"polite" }),
      h("div", { class:"chat-foot" }, ta, h("button", { class:"btn primary small", id:"chatSend", onclick: () => this.send() }, "보내기")));
    document.body.append(this.el);
    // drag by the header (desktop only)
    let drag = null;
    head.addEventListener("pointerdown", (e) => {
      if (innerWidth <= 700 || e.target.closest("button")) return;
      const r = this.el.getBoundingClientRect(); drag = { dx:e.clientX - r.left, dy:e.clientY - r.top };
      head.setPointerCapture(e.pointerId); this.el.classList.add("dragging");
    });
    head.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const r = this.el.getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - drag.dx, 4), innerWidth - r.width - 4);
      const y = Math.min(Math.max(e.clientY - drag.dy, 4), innerHeight - 48);
      this.el.style.left = x + "px"; this.el.style.top = y + "px";
    });
    const end = () => { if (!drag) return; drag = null; this.el.classList.remove("dragging"); this.saveBox(); };
    head.addEventListener("pointerup", end); head.addEventListener("pointercancel", end);
    // resize from any edge or corner
    for (const dir of ["n","s","e","w","ne","nw","se","sw"]){
      const hd = h("div", { class:"rz rz-" + dir, "aria-hidden":"true" });
      let st = null;
      hd.addEventListener("pointerdown", (e) => {
        if (innerWidth <= 700) return;
        if (this.mode !== "normal") this.setMode("normal");
        const r = this.el.getBoundingClientRect(); st = { x:e.clientX, y:e.clientY, l:r.left, t:r.top, w:r.width, h:r.height };
        hd.setPointerCapture(e.pointerId); this.el.classList.add("dragging"); e.preventDefault();
      });
      hd.addEventListener("pointermove", (e) => {
        if (!st) return;
        const dx = e.clientX - st.x, dy = e.clientY - st.y, MINW = 300, MINH = 220;
        let { l, t, w, h:hh } = st;
        if (dir.includes("e")) w = Math.min(Math.max(st.w + dx, MINW), innerWidth - st.l - 4);
        if (dir.includes("s")) hh = Math.min(Math.max(st.h + dy, MINH), innerHeight - st.t - 4);
        if (dir.includes("w")){ w = Math.min(Math.max(st.w - dx, MINW), st.l + st.w - 4); l = st.l + st.w - w; }
        if (dir.includes("n")){ hh = Math.min(Math.max(st.h - dy, MINH), st.t + st.h - 4); t = st.t + st.h - hh; }
        Object.assign(this.el.style, { left:l + "px", top:t + "px", width:w + "px", height:hh + "px" });
      });
      const stop = () => { if (!st) return; st = null; this.el.classList.remove("dragging"); this.saveBox(); };
      hd.addEventListener("pointerup", stop); hd.addEventListener("pointercancel", stop);
      this.el.append(hd);
    }
    addEventListener("resize", () => { if (this.isOpen()) this.setMode(this.mode); });
  },
  context(){
    const R = S.reader, d = S.decks[R.deckId];
    if (!d) return null;
    return { d, page:R.page, objs:d.objectives.filter(o => o.pages.includes(R.page)) };
  },
  paint(){
    if (!this.el) return;
    const c = this.context();
    this.el.querySelector("#chatTitle").textContent = c ? `질문하기 · p.${c.page}` : "질문하기";
    const log = this.el.querySelector("#chatLog");
    const nodes = [];
    if (!this.msgs.length){
      nodes.push(h("p", { class:"chat-hint", text:"지금 보는 쪽을 근거로 답해요. 바로 물어보거나 아래에서 골라 보세요." }));
      nodes.push(h("div", { class:"chat-sugs" }, ["이 쪽 쉽게 설명해 줘", "핵심만 한 줄로 알려 줘", "원문 줄마다 쉬운 말로 풀어 줘", "예시 숫자로 한 번 보여 줘"].map(q =>
        h("button", { class:"chip-btn", onclick: () => { this.el.querySelector("textarea").value = q; this.send(); } }, q))));
    }
    for (const m of this.msgs){
      nodes.push(h("div", { class:"bubble " + m.role },
        m.page ? h("span", { class:"bpage", text:`p.${m.page}` }) : null,
        h("div", { class:"btext" }, m.role === "assistant" ? richLines(m.content || "…") : m.content)));
    }
    if (this.err) nodes.push(h("p", { class:"check", text:this.err }));
    log.replaceChildren(...nodes);
    log.scrollTop = log.scrollHeight;
    const send = this.el.querySelector("#chatSend");
    send.textContent = this.busy ? "멈추기" : "보내기";
    send.onclick = () => this.busy ? (this.ctl && this.ctl.abort()) : this.send();
  },
  prompt(c, text){
    text = String(text || "").slice(0, 6000);
    return `너는 학습자가 지금 읽고 있는 자료를 옆에서 도와주는 튜터다.

규칙
- 아래 [지금 보는 쪽]의 원문을 근거로 답한다. 원문에 없는 내용을 덧붙일 때는 그 문장 앞에 "원문 밖 설명:"이라고 밝힌다.
- 쉽고 짧게, 보통 3~6문장. "줄마다 풀어 달라"는 요청이면 원문 줄을 짧게 인용하고 바로 아래에 쉬운 말 한두 문장을 붙인다.
- 원문의 기호와 용어는 바꾸지 않는다. 기준점, 방향, 부호, 단위, 조건을 빠뜨리지 않는다. 식은 $...$ 안에 LaTeX로 쓴다.
- 질문이 이 쪽과 무관하면 짧게 답하고, 이 쪽과 어떻게 이어지는지 한 문장 덧붙인다.
- 마크다운 기호(#, *, **, -)는 쓰지 않고 평문으로 쓴다. 단계는 "1)" "2)"처럼 적는다.

[자료] ${c.d.title}
[지금 보는 쪽 p.${c.page}]
${text || "(이 쪽은 추출된 글자가 없다. 이미지 위주의 쪽일 수 있다.)"}
${c.objs.length ? `\n[이 쪽의 학습목표]\n${c.objs.map(o => "- " + o.statement).join("\n")}` : ""}
`;
  },
  async send(){
    const ta = this.el.querySelector("textarea");
    const q = ta.value.trim(); if (!q || this.busy) return;
    const c = this.context();
    if (!c || !sampleFn){ this.err = "이 화면에서는 Claude를 호출할 수 없어요."; this.paint(); return; }
    if (S.session) S.session.viewed.add(c.d.id + ":" + c.page);   // asking about a page during practice counts as help
    ta.value = ""; this.err = "";
    this.msgs.push({ role:"user", content:q, page:c.page });
    const reply = { role:"assistant", content:"" }; this.msgs.push(reply);
    this.busy = true; this.ctl = new AbortController(); this.paint();
    const history = this.msgs.slice(0, -1).slice(-12).map(m => ({ role:m.role, content: m.role === "user" && m.page ? `(p.${m.page}를 보며) ${m.content}` : m.content })).filter(m => m.content);
    const turns = [{ role:"user", content:this.prompt(c, await pageText(c.d, c.page)) }, ...history];
    try{
      await sampleFn(turns, { cache:false, signal:this.ctl.signal, onText: ({ text }) => { reply.content = text; const last = this.el.querySelector("#chatLog .bubble.assistant:last-of-type .btext"); if (last) last.replaceChildren(...richLines(text)); } });
      if (JSON.stringify(reply.content).includes("$") && !window.katex){ await ensureKatex(); }
    }catch(e){
      if (e && e.text) reply.content = e.text;
      if (!(e && e.code === "cancelled")) this.err = sampleErrorCopy(e);
      if (!reply.content) this.msgs.pop();
    }finally{ this.busy = false; this.ctl = null; this.paint(); }
  }
};
function richLines(text){
  return String(text).split(/\n/).flatMap((line, i) => {
    const m = line.match(/^\s*원문 밖 설명\s*[:：]\s*(.*)$/);
    const node = m ? h("span", { class:"outside" }, h("b", { text:"원문 밖 설명" }), ...richText(m[1])) : null;
    const parts = node ? [node] : richText(line);
    return i ? [h("br"), ...parts] : parts;
  });
}
/* ----- records ----- */
function renderRecords(){
  const decks = Object.values(S.decks).sort((a,b) => (a.example?1:0) - (b.example?1:0) || b.createdAt - a.createdAt);
  if (!decks.length) return h("div", { class:"panel", text:"아직 자료가 없어요." });
  if (!S.recordsDeck || !S.decks[S.recordsDeck]) S.recordsDeck = decks[0].id;
  const deck = S.decks[S.recordsDeck];
  const sel = h("select", { id:"deckSel", class:"btn", style:"font-weight:500" }, decks.map(d => h("option", { value:d.id, selected: d.id === deck.id ? "selected" : null }, d.title)));
  sel.addEventListener("change", () => { S.recordsDeck = sel.value; S.deleting = null; render(); });
  const graded = deck.events.filter(e => e.kind === "submit" && !e.assisted && !e.gaveUp && !e.afterReading);
  const acc = graded.length ? Math.round(graded.filter(e => e.correct).length / graded.length * 100) : null;
  const st = deck.items.map(it => itemStatus(deck, it));
  const cnt = (k) => st.filter(x => x === k).length;
  const wrap = h("div", { class:"stack" });
  wrap.append(h("div", { class:"row", style:"justify-content:space-between" },
    h("div", { class:"row" }, h("label", { for:"deckSel", class:"small muted", text:"자료" }), sel),
    S.deleting === deck.id
      ? h("div", { class:"confirm" }, h("span", { text:"이 자료와 기록을 모두 지울까요?" }), h("button", { class:"btn small", onclick: async () => { await Store.remove(deck.id); delete S.decks[deck.id]; S.deleting = null; S.recordsDeck = null; if (!Object.keys(S.decks).length){ const ex = exampleDeck(); S.decks[ex.id] = ex; } render(); } }, "지우기"), h("button", { class:"btn small ghost", onclick: () => { S.deleting = null; render(); } }, "취소"))
      : h("button", { class:"btn small ghost", onclick: () => { S.deleting = deck.id; render(); } }, "자료 지우기")
  ));
  wrap.append(h("div", { class:"tiles" },
    h("div", { class:"tile" }, h("b", { class:"num", style:"color:var(--good)", text:String(cnt("recent") + cnt("steady")) }), h("span", { text:"혼자 맞힘 (최근)" })),
    h("div", { class:"tile" }, h("b", { class:"num", style:"color:var(--bad)", text:String(cnt("review")) }), h("span", { text:"복습 필요" })),
    h("div", { class:"tile" }, h("b", { class:"num", style:"color:var(--help)", text:String(cnt("assisted")) }), h("span", { text:"정답 보고만 풂" })),
    h("div", { class:"tile" }, h("b", { class:"num", style:"color:var(--read)", text:String(cnt("readcheck")) }), h("span", { text:"읽은 직후만 풂" })),
    h("div", { class:"tile" }, h("b", { class:"num", text:String(cnt("new")) }), h("span", { text:"안 풀어봄" })),
    h("div", { class:"tile" }, h("b", { class:"num", text: acc == null ? "–" : acc + "%" }), h("span", { text:`자동 채점 정답률 (${graded.length}회)` }))
  ));
  const tbody = h("tbody");
  deck.items.forEach((it, idx) => {
    const o = deck.objectives.find(x => x.id === it.objectiveId);
    const evs = deck.events.filter(e => e.item === it.id && e.kind !== "reveal");
    const s = deck.sched[it.id];
    const status = STATUS[st[idx]];
    tbody.append(h("tr", null,
      h("td", null, h("div", { style:"font-weight:600", text:o ? o.statement : it.prompt }), h("div", { class:"small muted" }, `p.${it.page} · ${FORMAT_LABEL[it.format]} · `, h("button", { class:"linkish", onclick: () => openReader(deck.id, it.page, it.objectiveId) }, "원문"))),
      h("td", null, h("span", { class:`chip ${status.cls}`, text:status.label })),
      h("td", null, h("div", { class:"trail", title:"왼쪽이 오래된 기록" }, evs.slice(-14).map(e => {
        const ok = e.kind === "submit" ? e.correct : e.rating === "remembered";
        const cls = e.assisted ? "h" : e.afterReading ? (ok ? "c" : "r") : e.kind === "rate" ? (ok ? "s" : "r") : ok ? "g" : "r";
        return h("i", { class:cls, title: new Date(e.t).toLocaleString("ko-KR") });
      }))),
      h("td", { class:"n small", text: s && s.seen ? (s.due <= now() ? "지금" : fmtWhen(s.due)) : "–" })
    ));
  });
  wrap.append(h("div", { class:"table-wrap" }, h("table", null,
    h("thead", null, h("tr", null, h("th", { text:"학습목표" }), h("th", { text:"상태" }), h("th", { text:"기록 (최근 14회)" }), h("th", { text:"다음 복습" }))),
    tbody
  )));
  wrap.append(h("div", { class:"legend" },
    h("span", { style:"--c:var(--good)", text:"자동 채점 정답" }),
    h("span", { style:"--c:var(--accent)", text:"자기평가: 떠올림" }),
    h("span", { style:"--c:var(--bad)", text:"못 떠올림" }),
    h("span", { style:"--c:var(--help)", text:"정답 본 뒤 풂 (셈에서 제외)" }),
    h("span", { style:"--c:var(--read)", text:"읽은 직후 맞힘 (셈에서 제외)" })
  ));
  wrap.append(h("p", { class:"small muted", text:"‘3일 이상 혼자 맞힘’은 서로 다른 3일에 정답을 보기 전 스스로 맞힌 경우예요. 숙달했다는 판정이 아니라, 지금까지의 근거를 그대로 보여주는 표시입니다." }));
  return wrap;
}

/* ---------- boot ---------- */
(function boot(){
  const ex = exampleDeck(); S.decks[ex.id] = ex;
  updateStoreChip(); render();
  initSample().then(() => { if (S.view === "create") render(); });
  Store.init().then(async () => {
    updateStoreChip();
    const saved = await Store.loadAll();
    for (const [id, d] of Object.entries(saved)){ if (d && Array.isArray(d.items)){ d.events = d.events || []; d.sched = d.sched || {}; S.decks[id] = d; } }
    if (!S.session) render();
  });
})();
</script>
