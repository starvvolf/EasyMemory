<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생성 실험실 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  생성 실험실(/lab) 화면 시안. 작업지시_08_생성실험실.md의 화면 기준이다.
  가짜 데이터로 움직이는 정적 시안이며 서버와 연결되지 않는다.
  색·글꼴 토큰은 /study(src/app/study/dejipgi.css)와 같다.
-->
<style>
:root{
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --line:#D8DEE5; --line-strong:#B9C2CC;
  --ink:#16202A; --muted:#5A6774; --faint:#8A96A2;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E6ECFB;
  --good:#1D7F52; --good-soft:#E3F3EA; --bad:#B93A26; --bad-soft:#FBE8E4; --help:#9A6400; --help-soft:#FBF0DA;
  --reuse:#6B7682; --reuse-soft:#ECEFF2;
  --shadow:0 1px 2px rgba(22,32,42,.06),0 8px 24px rgba(22,32,42,.07);
  --radius:12px;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1318; --surface:#161D24; --surface-2:#1C242C; --line:#2A343E; --line-strong:#3A4652;
    --ink:#E5EAEF; --muted:#9AA7B3; --faint:#6F7C88;
    --accent:#7FA2FF; --accent-ink:#0B1222; --accent-soft:#1D2A48;
    --good:#5CC896; --good-soft:#15302A; --bad:#FF8A73; --bad-soft:#3A1E19; --help:#E8B458; --help-soft:#3A2D14;
    --reuse:#98A4B0; --reuse-soft:#222B34;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1318; --surface:#161D24; --surface-2:#1C242C; --line:#2A343E; --line-strong:#3A4652;
  --ink:#E5EAEF; --muted:#9AA7B3; --faint:#6F7C88;
  --accent:#7FA2FF; --accent-ink:#0B1222; --accent-soft:#1D2A48;
  --good:#5CC896; --good-soft:#15302A; --bad:#FF8A73; --bad-soft:#3A1E19; --help:#E8B458; --help-soft:#3A2D14;
  --reuse:#98A4B0; --reuse-soft:#222B34;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}

/* 머리줄 */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;font-weight:600;letter-spacing:-.01em}
.top .sp{flex:1}
.conn{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* 배치 */
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 53px)}
.side{border-right:1px solid var(--line);background:var(--surface-2);padding:14px 12px;overflow:auto}
.main{padding:18px 22px 60px;min-width:0}
.with-pdf .main{padding-right:22px}
.pdf{position:fixed;top:53px;right:0;bottom:0;width:min(440px,40vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:4}
.with-pdf .main{margin-right:min(440px,40vw)}

/* 버튼 */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.small{padding:3px 9px;font-size:12.5px}
.btn.block{width:100%}

/* 실행 목록 */
.runs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.run{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:3px}
.run[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.run .t{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center;min-width:0}
.run .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .m{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.run .memo{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500;white-space:nowrap}
.b-run{background:var(--accent-soft);color:var(--accent)}
.b-ok{background:var(--good-soft);color:var(--good)}
.b-warn{background:var(--help-soft);color:var(--help)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-gray{background:var(--reuse-soft);color:var(--reuse)}
.fake{font-size:10.5px;border:1px dashed var(--line-strong);color:var(--muted);border-radius:4px;padding:0 4px}

/* 제목줄 */
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.head h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.head .facts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.purpose{margin:6px 0 0;color:var(--muted);font-size:13px}
.memoline{margin-top:6px;font-size:13px;display:flex;gap:6px;align-items:center}
.memoline input{border:1px dashed var(--line);background:none;border-radius:6px;padding:2px 8px;min-width:0;flex:1;max-width:420px;color:var(--muted)}

/* 단계 줄 */
.pipe{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stage{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stage[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stage .name{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.with-pdf .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
.stage .ico{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;flex:none;color:#fff}
.s-done .ico{background:var(--good)} .s-warn .ico{background:var(--help)} .s-fail .ico{background:var(--bad)}
.s-run .ico{background:var(--accent);animation:pulse 1.2s infinite} .s-wait .ico{background:var(--line-strong)} .s-reuse .ico{background:var(--reuse)}
@keyframes pulse{50%{opacity:.45}}
.stage .time{font-size:13px}
.stage .model{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage .retry{position:absolute;top:8px;right:9px;font-size:11px;color:var(--help);font-weight:600}
.s-wait{background:var(--surface-2)} .s-wait .time{color:var(--faint)}
.next{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.next select{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--surface);width:100%}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:12px;background:var(--surface-2)}
.bar i{display:block;height:100%}
.barlegend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:4px}

/* 단계 상세 */
.detail{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-size:15px}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.summary{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pane{padding:14px 16px 18px}

/* 결과 모양들 */
.tree{list-style:none;margin:0;padding:0}
.tree li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);min-width:0}
.tree li:last-child{border-bottom:0}
.tree .lvl{flex:none}
.tree .ttl{flex:1;min-width:0}
.pg{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface);white-space:nowrap}
button.pg:hover{border-color:var(--accent);color:var(--accent)}
.pg.warn{border-color:var(--help);color:var(--help);background:var(--help-soft)}
.obj{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.obj.warn{border-color:var(--help);box-shadow:inset 3px 0 0 var(--help)}
.obj h4{margin:0 0 6px;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.obj h4 .n{color:var(--faint);font-weight:500;white-space:nowrap}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.quote{border-left:3px solid var(--line-strong);padding:2px 0 2px 10px;color:var(--ink);font-size:13px}
.quote button{border:0;background:none;padding:0;color:var(--accent);font-size:12px;margin-left:6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line-strong)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.warnline{display:flex;gap:8px;align-items:flex-start;background:var(--help-soft);color:var(--help);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.errline{background:var(--bad-soft);color:var(--bad)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card .q{font-weight:500}
.card .a{color:var(--good);font-size:13px;margin-top:4px}
.qdoc{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--surface-2)}
.qdoc .blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--ink);margin:0 4px}
.reveal{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--good-soft);color:var(--good);font-size:13px}

/* 보낸 입력 / 재시도 */
.calls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.calls button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.calls button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.fact{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fact .k{font-size:11.5px;color:var(--muted)} .fact .v{font-size:15px;font-weight:600}
details.block{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.block summary{padding:8px 12px;cursor:pointer;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
details.block pre{margin:0;padding:10px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;background:var(--surface-2)}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff div{padding:2px 10px;white-space:pre-wrap;word-break:break-word}
.diff .del{background:var(--bad-soft);color:var(--bad)} .diff .add{background:var(--good-soft);color:var(--good)}
.attempt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.attempt .hd{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}

/* PDF 보기 */
.pdf .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pdf .pb{flex:1;overflow:auto;padding:16px;background:var(--surface-2)}
.page{background:#fff;color:#222;aspect-ratio:4/3;border:1px solid var(--line);box-shadow:var(--shadow);padding:22px;font-family:Georgia,serif;font-size:13px;line-height:1.5}
.page h5{margin:0 0 10px;font-size:18px}
.page mark{background:#F7E26B;color:#3A3000}

/* 겹창 */
.scrim{position:fixed;inset:0;background:rgba(14,19,24,.45);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto}
.dialog.sm{width:min(420px,100%)}
.dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.dialog .dh h3{margin:0;font-size:16px;flex:1}
.dialog .db{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
table.models{width:100%;border-collapse:collapse;font-size:13px}
table.models td,table.models th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
table.models th{font-size:12px;color:var(--muted);font-weight:500}
table.models select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);width:100%}
table.models tr.all td{background:var(--surface-2)}
.toggle{display:flex;gap:8px;align-items:center;font-size:13px}

/* 좁은 화면 */
@media (max-width: 900px){
  .layout{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .runs{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .run{min-width:220px}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .with-pdf .main{margin-right:0}
  .pdf{width:100%;top:0;z-index:30}
  .facts4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{padding:14px 16px 60px}
  .top .conn .label{display:none}
}
@media (max-width: 480px){
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:1fr}
  .tabs{margin-left:0;width:100%}
}
</style>
</head>
<body>
<header class="top">
  <h1>생성 실험실</h1>
  <span class="sp"></span>
  <span class="conn"><span class="dot"></span><span class="label">ChatGPT 연결됨</span></span>
  <span class="seg" role="group" aria-label="모델 종류">
    <button id="modeFake" aria-pressed="false">가짜 모델</button>
    <button id="modeReal" aria-pressed="true">실제 모델</button>
  </span>
</header>
<div class="layout" id="layout">
  <aside class="side">
    <button class="btn primary block" id="newBtn">+ 새 실행</button>
    <div class="runs" id="runs"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<aside class="pdf" id="pdf" hidden></aside>
<div id="modal"></div>

<script>
/* ---------- 가짜 데이터 ---------- */
const STAGES = [
  ["analyze","분석"],["concept-tree","개념 구조"],["learning-design","학습 설계"],
  ["activity-design","활동 설계"],["cards","카드"],["authoring","출제"]];
const MODELS = ["gpt-6-sol","gpt-6-astra","gpt-6-luna"];
const EFFORTS = ["low","medium","high","xhigh","max"];

const RUNS = [
  { id:"r3", file:"03_Three Dimensional Viewing.pdf", pages:"p.1–44", total:44, purpose:"시험 대비로 3D 관측 개념을 떠올릴 수 있게", memo:"학습 설계만 sol·high, 나머지 luna·low",
    status:["b-warn","멈춤 · 단계 확인"], fake:false, created:"오늘 14:02", calls:4, time:"2:41",

    status:["b-ok","완료"], fake:false, created:"오늘 11:40", calls:7, time:"4:12",
    stages:{ analyze:{s:"done",ms:21000,m:"sol·medium"}, "concept-tree":{s:"done",ms:38000,m:"sol·medium"},

];
const OUTLINE = [
  [0,"Three-Dimensional Viewing","1–44"],[1,"Overview of 3D Viewing Concepts","2–5"],[1,"The 3D Viewing Pipeline","6–9"],
  [1,"Viewing-Coordinate Parameters","10–15"],[1,"Transformation from World to Viewing Coordinates","16–20"],
  [1,"Projection Transformations","21–30"],[2,"Orthogonal Projections","22–25"],[2,"Perspective Projections","26–30"],
  [1,"Clipping Window and View Volume","31–38"],[1,"Normalization Transformation","39–44"]];
const TREE = [
  [0,"3D 관측",null],[1,"3D 관측 개념 개요",null,"쪽 근거 없음 (1차 시도)"],[1,"관측 파이프라인","6–9"],
  [2,"모델링 → 월드 → 관측 좌표","7"],[1,"관측 좌표 매개변수 (P0, N, V)","10–13"],[1,"투영 변환","21–30"],
  [2,"평행 투영","22–25"],[2,"원근 투영","26–30"],[1,"뷰 볼륨과 클리핑","31–38"]];
